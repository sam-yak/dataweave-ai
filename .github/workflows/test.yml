name: DataWeave AI Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas python-dateutil
          # Install project deps if requirements.txt exists
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          pytest tests/test_transform.py tests/test_validation.py tests/test_sanitizer.py tests/test_ingestion.py -v --tb=short
        env:
          # Tests that don't need external services run without these
          # Pattern Agent and Schema Agent tests require Supabase, so excluded from CI
          PYTHONPATH: .

